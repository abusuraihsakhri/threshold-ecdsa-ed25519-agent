name: Python checks

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,test]"
          python -m pip check
      - name: Check Python syntax
        run: python -m compileall -q agents threshold_mpc_wallet cli.py simulator.py enrichment.py
      - name: Run tests
        run: python -m pytest -q
      - name: Audit-chain smoke test
        run: |
          python -c "from agents.base import AuditTrail; t=AuditTrail(); t.log('ci','test','smoke',{'status':'ok'}); assert t.verify_integrity()"
      - name: Check browser evaluator JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("web/index.html").read_text(encoding="utf-8")
          assert html.count("<script>") == html.count("</script>") == 1
          Path("/tmp/threshold-evaluator.js").write_text(html.split("<script>", 1)[1].split("</script>", 1)[0], encoding="utf-8")
          PY
          node --check /tmp/threshold-evaluator.js
