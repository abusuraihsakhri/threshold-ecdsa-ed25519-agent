[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "threshold-ecdsa-ed25519-engine"
version = "2.0.0"
description = "Threshold ECDSA / Ed25519 Distributed MPC Wallet Custody Supervisor"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
threshold-ecdsa-ed25519-engine = "threshold_mpc_wallet.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/threshold-ecdsa-ed25519-engine"
Repository = "https://github.com/abusuraihsakhri/threshold-ecdsa-ed25519-engine.git"
