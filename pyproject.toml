[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "threshold-ecdsa-ed25519-engine"
version = "2.0.0"
description = "Rule-based supervisory telemetry evaluator (not a threshold-signature implementation)"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
api = ["fastapi>=0.100,<1", "uvicorn>=0.23,<1"]
test = ["pytest>=7,<10", "httpx>=0.24,<1"]

[project.scripts]
threshold-ecdsa-ed25519-engine = "cli:main"
threshold-mpc-wallet = "threshold_mpc_wallet.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/threshold-ecdsa-ed25519-agent"
Repository = "https://github.com/abusuraihsakhri/threshold-ecdsa-ed25519-engine.git"
